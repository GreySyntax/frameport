name: build
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra dev
      - run: uv run pytest -m "not games and not device"

  bundle:
    needs: test
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Linux build deps (GTK for Flutter desktop)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: uv sync --extra dev
      - run: uv run python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: FramePort-${{ runner.os }}
          path: dist/
