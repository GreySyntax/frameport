name: Problem report
description: A game or FramePort doesn't work (FramePort → "Report a problem…" fills this in and saves a diagnostics zip).
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the **diagnostics zip** FramePort saved (drag it into the "Diagnostics" box below). It contains
        logs, the recipe and device details with personal data removed — no game files. Without the app, it can be
        read with `frameport diag inspect <zip>`.
  - type: input
    id: game
    attributes:
      label: Game
      description: Title — package id (version, engine / XR API); empty for app problems
  - type: textarea
    id: description
    attributes:
      label: What happens?
      description: What you did, what you expected, what you saw (in the headset, if it started)
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Launch test / triage
      description: Filled in by FramePort from the last launch test
  - type: textarea
    id: recipe
    attributes:
      label: Recipe
      render: yaml
  - type: textarea
    id: environment
    attributes:
      label: Environment
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Drag the FramePort-diag-*.zip here (max 25 MB)
    validations:
      required: true
